apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  annotations:
    # Wave 2: after the migration Job (wave 1) has completed.
    argocd.argoproj.io/sync-wave: "2"
    {{- include "app.acceptedFindings" . | nindent 4 }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        {{- include "app.labels" . | nindent 8 }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: postgres
            {{- if .Values.aiSecret }}
            # AI_BASE_URL, AI_MODEL and AI_TOKEN for api/src/ai.ts: calls leave through the door guard.
            - secretRef:
                name: {{ .Values.aiSecret }}
            {{- end }}
          ports:
            - containerPort: 3001
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
