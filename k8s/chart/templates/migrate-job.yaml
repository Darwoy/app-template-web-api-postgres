apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Values.images.api.tag | trunc 7 }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- include "app.acceptedFindings" . | nindent 4 }}
    # Wave 1: after the Secret and Postgres (wave 0) are healthy, before the
    # application (wave 2). A PreSync hook cannot work here -- it runs before
    # any resource of the release exists, including the Secret it reads.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: migrate
        {{- include "app.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: Always
          # The binary directly, not `npm run migrate`: npm wants a writable
          # cache directory, and this container has a read-only root filesystem.
          command: ["node", "node_modules/.bin/node-pg-migrate", "-m", "migrations", "-j", "js", "up"]
          envFrom:
            - secretRef:
                name: postgres
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
