host: template.127.0.0.1.sslip.io

images:
  web:
    repository: ghcr.io/darwoy/app-template-web-api-postgres/web
    tag: "a66d580"
  api:
    repository: ghcr.io/darwoy/app-template-web-api-postgres/api
    tag: "a66d580"

replicas: 1

resources:
  web:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  api:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

postgres:
  storage: 1Gi
  user: app
  password: app-local-only
  database: app
