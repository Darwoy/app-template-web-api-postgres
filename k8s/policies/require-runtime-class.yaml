apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-runtime-class
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  validations:
    - expression: >-
        object.spec.template.spec.?runtimeClassName.orValue('') == 'gvisor'
      message: "Deployments and Jobs run generated code and must set runtimeClassName: gvisor."
