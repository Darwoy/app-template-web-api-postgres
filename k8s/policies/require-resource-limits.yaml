apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  variables:
    - name: allContainers
      expression: >-
        object.spec.template.spec.containers +
        object.spec.template.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          'cpu' in c.?resources.?limits.orValue({}) &&
          'memory' in c.?resources.?limits.orValue({}))
      message: "Every container must set cpu and memory limits."
