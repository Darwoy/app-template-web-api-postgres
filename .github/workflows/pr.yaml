name: pr
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
  security-events: write
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://app:app@localhost:5432/app
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx --workspace=tests playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: |
          for i in $(seq 1 60); do curl -fs localhost:3000 >/dev/null && break; sleep 2; done
          curl -fs localhost:3001/health
      - run: npm run scenarios
      - run: npm run rules
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: tests/playwright-report }
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: kyverno/action-install-cli@v0.2.0
        # The action defaults to v1.10.3, which predates ValidatingPolicy.
        # Pin the version the policies were written and tested against.
        with: { release: v1.19.1 }
      - run: bash scripts/lint-manifests.sh
      - run: |
          helm template preview k8s/chart -f k8s/chart/values-small.yaml \
            --namespace template-preview \
            --set images.web.tag=abc1234 --set images.api.tag=abc1234 > rendered.yaml
      - uses: bridgecrewio/checkov-action@v12
        with:
          file: rendered.yaml
          framework: kubernetes
          soft_fail: false
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [web, api]
    steps:
      - uses: actions/checkout@v4
      - id: image
        # GHCR wants lowercase, and a generated repository has its own name: compute, never hardcode.
        # The tag is the pull request's head commit, which is what the builder's preview deploys.
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          COMPONENT: ${{ matrix.component }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
