name: main
on:
  push:
    branches: [main]
concurrency: { group: release-main, cancel-in-progress: false }
permissions:
  contents: write
  packages: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/koosha-t/app-template-web-api-postgres/web:${{ steps.sha.outputs.short }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/koosha-t/app-template-web-api-postgres/api:${{ steps.sha.outputs.short }}
      - name: commit image tags into the chart
        run: |
          sed -i "s/^\(\s*tag:\s*\).*/\1\"${{ steps.sha.outputs.short }}\"/" k8s/chart/values.yaml
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(release): images ${{ steps.sha.outputs.short }} [skip ci]"
          git push origin HEAD:main
