name: main
on:
  push:
    branches: [main]
concurrency:
  group: release-main
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      # The tag commit is pushed by an installed GitHub App, which is the only
      # identity a ruleset can name as a bypass actor. github-actions[bot] is a
      # platform feature, not an installed app, so it can never be named.
      - name: mint an installation token for the release app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Images must run on both arm64 (developer machines, the local kind
      # cluster) and amd64 (cloud nodes), so build a manifest list for both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/darwoy/app-template-web-api-postgres/web:${{ steps.sha.outputs.short }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/darwoy/app-template-web-api-postgres/api:${{ steps.sha.outputs.short }}
      - name: commit image tags into the chart
        run: |
          sed -i "s/^\(\s*tag:\s*\).*/\1\"${{ steps.sha.outputs.short }}\"/" k8s/chart/values.yaml
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(release): images ${{ steps.sha.outputs.short }} [skip ci]"
          git push origin HEAD:main
