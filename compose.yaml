services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # 5433 on the host: a developer machine often already runs Postgres on 5432.
    # Inside this network, in CI and in the cluster the port is the usual 5432.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30
  api:
    build: { context: ./api }
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      PORT: "3001"
    command: sh -c "node node_modules/.bin/node-pg-migrate -m migrations -j js up && node dist/server.js"
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["3001:3001"]
  web:
    build: { context: ./web }
    environment:
      API_URL: http://api:3001
    depends_on: [api]
    ports: ["3000:3000"]
